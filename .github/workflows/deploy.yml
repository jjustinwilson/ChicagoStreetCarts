name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Write js/config.js from secrets
        env:
          CARTO_API_KEY: ${{ secrets.CARTO_API_KEY }}
        run: |
          printf 'window.APP_CONFIG = { CARTO_API_KEY: %s };\n' \
            "$(jq -Rn --arg k "$CARTO_API_KEY" '$k')" > js/config.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
